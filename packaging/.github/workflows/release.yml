name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: '20'

      - name: Run Go tests
        run: go test -v ./...

      - name: Run Web tests and build (if present)
        shell: bash
        run: |
          if [ -d "web" ] && [ -f "web/package.json" ]; then
            cd web
            npm ci
            npm test --if-present
            if npm run | grep -q "build:real"; then
              npm run build:real
            elif npm run | grep -q "build"; then
              npm run build
            fi
            cd ..
          fi

      - name: Compile all platform targets and assemble packages
        run: node packaging/scripts/build.mjs --publish-ready

      - name: Verify package layout and mappings
        run: node packaging/scripts/verify.mjs

      - name: Pack packages into tarballs
        run: node packaging/scripts/pack.mjs

      - name: Smoke test installed package from tarballs
        shell: bash
        run: |
          SMOKE_DIR=$(mktemp -d 2>/dev/null || mktemp -d -t 'mem-smoke')
          cd "$SMOKE_DIR"
          npm init -y

          PLATFORM=""
          ARCH=""
          case "$(uname -s)" in
            Linux*)     PLATFORM="linux";;
            Darwin*)    PLATFORM="darwin";;
            MINGW*|MSYS*|CYGWIN*) PLATFORM="win32";;
            *)          PLATFORM="unknown";;
          esac

          case "$(uname -m)" in
            x86_64|amd64) ARCH="x64";;
            arm64|aarch64) ARCH="arm64";;
            *) ARCH="unknown";;
          esac

          MAIN_TGZ=$(find "$GITHUB_WORKSPACE/packaging/dist/tarballs" -maxdepth 1 -name "*-mem-[0-9]*.tgz" | head -n 1)
          PLATFORM_TGZ=$(find "$GITHUB_WORKSPACE/packaging/dist/tarballs" -maxdepth 1 -name "*${PLATFORM}-${ARCH}*.tgz" | head -n 1)

          echo "Installing $MAIN_TGZ and $PLATFORM_TGZ..."
          npm install --no-optional "$MAIN_TGZ" "$PLATFORM_TGZ"

          export MEM_CONFIG="$SMOKE_DIR/mem-test-config.json"

          npx mem version
          npx mem help
          npx mem context ls

          # Stdio MCP handshake transparency verification
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke-test","version":"1"}}}' | npx mem mcp > mcp_out.txt
          cat mcp_out.txt
          grep -q '"result"' mcp_out.txt

      - name: Upload tarball artifacts (Ubuntu only to deduplicate)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: npm-tarballs
          path: packaging/dist/tarballs/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm and GitHub Releases
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: npm-tarballs
          path: packaging/dist/tarballs

      - name: Build raw binaries for release assets
        run: |
          go version
          node packaging/scripts/build.mjs --publish-ready

      - name: Publish platform packages first, then main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packaging/dist/tarballs
          # Publish platform packages first
          for tgz in *linux*.tgz *darwin*.tgz *win32*.tgz; do
            if [ -f "$tgz" ]; then
              echo "Publishing platform package $tgz..."
              npm publish "$tgz" --provenance --access public
            fi
          done

          # Publish main package last
          for tgz in *-mem-[0-9]*.tgz; do
            if [ -f "$tgz" ]; then
              echo "Publishing main package $tgz..."
              npm publish "$tgz" --provenance --access public
            fi
          done

      - name: Create Checksums and Release Assets
        run: |
          mkdir -p release-assets
          cp packaging/dist/tarballs/*.tgz release-assets/
          # Collect raw binaries
          find packaging/dist/packages -type f -path "*/bin/*" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            release-assets/*
          generate_release_notes: true
